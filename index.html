<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/icons/Icon_Accent Green.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boehringer Ingelheim</title>
    <!-- Startup screen: painted before any JavaScript loads, removed by src/boot.ts once the first screen is ready.
         Same design as src/components/BrandLoader.tsx -->
    <style>
      /* body only: a background on html would stop body's colour moving to the page canvas,
         and it would then cover the particles and background image, which sit on negative z-index */
      body { margin: 0; background: #08312a; }
      #boot-loader {
        position: fixed; inset: 0; z-index: 10000;
        display: flex; align-items: center; justify-content: center;
        background: #08312a;
        transition: opacity 0.6s ease;
      }
      #boot-loader.boot-loader--done { opacity: 0; pointer-events: none; }
      #boot-loader .mark { position: relative; width: 6vw; min-width: 4rem; aspect-ratio: 1; }
      #boot-loader svg { position: relative; width: 100%; height: 100%; }
      #boot-loader .base { fill: rgba(0, 228, 124, 0.18); }
      #boot-loader .fill { fill: #00e47c; transform-box: fill-box; animation: bootRise 1.6s cubic-bezier(0.55, 0, 0.3, 1) infinite; }
      #boot-loader .ring {
        position: absolute; inset: 0; border: 1px solid #00e47c; border-radius: 50%;
        animation: bootRing 2.4s ease-out infinite;
      }
      @keyframes bootRise {
        0% { transform: translateY(100%); opacity: 1; }
        65% { transform: translateY(0); opacity: 1; }
        85% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(0); opacity: 0; }
      }
      @keyframes bootRing {
        0% { transform: scale(1); opacity: 0.7; }
        100% { transform: scale(1.9); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .fill { animation: bootBreathe 2s ease-in-out infinite alternate; transform: none; }
        #boot-loader .ring { animation: none; opacity: 0; }
      }
      @keyframes bootBreathe { from { opacity: 0.35; } to { opacity: 0.9; } }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-label="Loading">
      <div class="mark">
        <span class="ring" aria-hidden="true"></span>
        <svg viewBox="0 0 500 500" aria-hidden="true">
          <defs>
            <path id="boot-mark-path" d="M112.6,459c-35.8-25.8-54.8-44.8-72.6-72.1c-25.8-40-40-88.4-40-136.3C0,112.1,111.6,0,250,0s250,112.1,250,250c0,56.9-19.5,113.7-53.7,155.8c-14.2,17.9-26.3,28.4-59,53.2V312.6h24.8v100c18.4-21.6,27.4-34.8,36.3-50.5c18.4-32.7,28.4-73.2,28.4-112.1C476.8,123.7,375.2,21,250,21S23.2,123.7,23.2,251.6c0,58.4,20.6,110,64.2,161.1v-100h25.3C112.6,312.6,112.6,459,112.6,459z M162.1,484.2c-4.7-1.1-15.8-6.3-24.8-11.1V312.6h24.8V484.2z M312.7,131.6L250,83.1l-62.6,48.4l-13.7-17.9L250,54.2l76.3,59.5L312.7,131.6z M212.1,497.4c-9-1.6-9.5-1.6-12.7-2.6c-2.6-0.5-3.7-0.5-12.1-2.6V150h24.8L212.1,497.4L212.1,497.4z M262.1,499.5c-3.7,0.5-4.7,0.5-10,0.5c-7.9,0-10.5,0-14.8-0.5V150h24.8V499.5L262.1,499.5z M312.1,491.6c-7.9,2.6-14.8,4.2-24.8,6.3V150h24.8V491.6L312.1,491.6z M362.7,473.2c-7.9,3.7-12.7,5.8-25.3,11.6V312.6h25.3C362.7,312.6,362.7,473.2,362.7,473.2z" />
            <clipPath id="boot-mark">
              <use href="#boot-mark-path" />
            </clipPath>
          </defs>
          <use href="#boot-mark-path" class="base" />
          <g clip-path="url(#boot-mark)">
            <rect x="0" y="0" width="500" height="500" class="fill" />
          </g>
        </svg>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
